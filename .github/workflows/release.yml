name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Electron
        run: npx electron-builder --win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-app/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
